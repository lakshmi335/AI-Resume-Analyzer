<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050810" />
    <meta
      name="description"
      content="ResumeAI — AI-powered resume analysis, ATS scoring, mock interviews, and resume comparison tool."
    />
    <meta name="keywords" content="resume analyzer, ATS score, AI resume review, mock interview, job search" />
    <meta name="author" content="ResumeAI" />

    <!-- Open Graph -->
    <meta property="og:title" content="ResumeAI — AI Resume Analyzer" />
    <meta property="og:description" content="Get instant AI feedback on your resume, ATS score, keyword analysis, and practice mock interviews." />
    <meta property="og:type" content="website" />

    <!-- Favicon inline SVG as data URI -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"
    />

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />

    <title>ResumeAI — AI Resume Analyzer</title>

    <style>
      /* Critical inline styles — prevent flash of unstyled content */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        background-color: #050810;
        color: #e2e8f0;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Initial page loader — hidden once React mounts */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #050810;
        gap: 1rem;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }

      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loader-brand {
        font-family: 'Syne', sans-serif;
        font-size: 1.5rem;
        font-weight: 800;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .loader-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #1e293b;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <noscript>
      <div style="
        display:flex; align-items:center; justify-content:center;
        min-height:100vh; background:#050810; color:#e2e8f0;
        font-family:sans-serif; text-align:center; padding:2rem;
      ">
        <div>
          <div style="font-size:3rem; margin-bottom:1rem;">⚡</div>
          <h1 style="font-size:1.5rem; margin-bottom:0.5rem;">JavaScript Required</h1>
          <p style="color:#64748b;">ResumeAI requires JavaScript to run. Please enable it in your browser settings.</p>
        </div>
      </div>
    </noscript>

    <!-- Initial loader — visible before React hydrates -->
    <div id="initial-loader">
      <div class="loader-brand">
        <span>⚡</span>
        <span>ResumeAI</span>
      </div>
      <div class="loader-spinner"></div>
    </div>

    <div id="root"></div>

    <script>
      // Hide the loader once React has mounted
      document.addEventListener('DOMContentLoaded', function () {
        var observer = new MutationObserver(function () {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            var loader = document.getElementById('initial-loader');
            if (loader) {
              loader.classList.add('hidden');
              setTimeout(function () { loader.remove(); }, 400);
            }
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      });
    </script>
  </body>
</html>
